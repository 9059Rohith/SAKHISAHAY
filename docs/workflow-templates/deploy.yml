name: Deploy approved release
on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [preview, production]
        default: preview
        required: true
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - name: Require deployment credentials
        run: test -n "$VERCEL_TOKEN" && test -n "$VERCEL_PROJECT_ID" && test -n "$VERCEL_ORG_ID"
      - run: npm install --global vercel@48.1.8
      - name: Deploy requested environment
        env: { TARGET: "${{ inputs.target }}" }
        run: |
          if [ "$TARGET" = production ]; then
            vercel deploy --yes --prod --token "$VERCEL_TOKEN" > deployment-url.txt
          else
            vercel deploy --yes --token "$VERCEL_TOKEN" > deployment-url.txt
          fi
      - name: Check live API
        run: python -m scripts.healthcheck "$(tail -n 1 deployment-url.txt)"
      - uses: actions/upload-artifact@v4
        with: { name: deployment-url, path: deployment-url.txt }
