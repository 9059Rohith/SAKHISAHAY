[project]
name = "sakhisahay-api"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi==0.162.2", "uvicorn==0.54.0", "motor==3.7.1", "pydantic==2.14.3", "pydantic-settings==2.16.2", "PyJWT==2.15.1", "argon2-cffi==25.1.0", "email-validator==2.3.0", "httpx==0.28.1", "aiosmtplib==5.1.3"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
exclude = [".venv", "node_modules"]
